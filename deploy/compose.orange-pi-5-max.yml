services:
  algorithm:
    image: ${ALGORITHM_IMAGE:-daib-algorithm:openeuler-arm64}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.algorithm
      args:
        BUILD_JOBS: ${BUILD_JOBS:-1}
        VIKIT_REF: ${VIKIT_REF:-master}
        FAST_LIVO_ARM_FLAGS: ${FAST_LIVO_ARM_FLAGS:--march=armv8-a}
        FOXGLOVE_BRIDGE_REF: ${FOXGLOVE_BRIDGE_REF:-0.8.5}
        ROS_BABEL_FISH_REF: ${ROS_BABEL_FISH_REF:-0.9.3}
        WEBSOCKETPP_REF: ${WEBSOCKETPP_REF:-0.8.2}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/ssd/data}:/data
      - ${BAGS_DIR:-/mnt/ssd/bags}:/bags:ro
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_HOSTNAME: 127.0.0.1
      START_ROS_MASTER: "true"
      ALGORITHM_LAUNCH: ${ALGORITHM_LAUNCH:-fast_livo mapping_mid70_d435i.launch rviz:=false use_camera:=false}
      BAG_ALGORITHM_LAUNCH: ${BAG_ALGORITHM_LAUNCH:-fast_livo mapping_mid70_d435i.launch rviz:=false use_camera:=true}
      ENABLE_FOXGLOVE: ${ENABLE_FOXGLOVE:-true}
      FOXGLOVE_PORT: ${FOXGLOVE_PORT:-8765}
      BAG_FILE: ${BAG_FILE:-}
      BAG_RATE: ${BAG_RATE:-1.0}
      BAG_DELAY: ${BAG_DELAY:-2.0}
      BAG_LOOP: ${BAG_LOOP:-false}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'source /opt/ros/noetic/setup.bash && rosparam list >/dev/null 2>&1'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  drivers:
    image: ${DRIVERS_IMAGE:-daib-drivers:openeuler-arm64}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.drivers
      args:
        BUILD_JOBS: ${BUILD_JOBS:-1}
        REALSENSE_FORCE_RSUSB_BACKEND: ${REALSENSE_FORCE_RSUSB_BACKEND:-ON}
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - ${DATA_DIR:-/mnt/ssd/data}:/data
    depends_on:
      algorithm:
        condition: service_healthy
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_HOSTNAME: 127.0.0.1
      CONFIGURE_LIDAR_INTERFACE: ${CONFIGURE_LIDAR_INTERFACE:-true}
      CONFIGURE_LIDAR_RP_FILTER: ${CONFIGURE_LIDAR_RP_FILTER:-true}
      VERIFY_LIDAR_RP_FILTER: ${VERIFY_LIDAR_RP_FILTER:-true}
      LIDAR_INTERFACE: ${LIDAR_INTERFACE:-enP3p49s0}
      LIDAR_HOST_CIDR: ${LIDAR_HOST_CIDR:-192.168.1.50/24}
      LIDAR_DEVICE_IP: ${LIDAR_DEVICE_IP:-192.168.1.119}
      ENABLE_REALSENSE: ${ENABLE_REALSENSE:-true}
      ENABLE_LIVOX: ${ENABLE_LIVOX:-true}
      REALSENSE_ARGS: ${REALSENSE_ARGS:-enable_depth:=true enable_color:=true enable_gyro:=true enable_accel:=true unite_imu_method:=linear_interpolation}
      LIVOX_ARGS: ${LIVOX_ARGS:-bd_list:=3GGDLA4001V3191 publish_freq:=10.0}
    shm_size: 512m
