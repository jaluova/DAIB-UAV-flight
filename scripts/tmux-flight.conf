# tmux-flight.conf
#
# Each command is sent to its own tmux pane. Edit these values on the Orange Pi
# to match the workflow you want to keep alive after SSH disconnects.

SESSION_NAME="daib"
WINDOW_NAME="flight"

# Pane 0: FAST-LIVO mapping.
PANE_0_COMMAND="docker exec -it daib-algorithm-adapter bash -lc 'source /opt/ros/noetic/setup.bash; source /opt/daib_ws/devel/setup.bash; exec roslaunch --screen fast_livo mapping_mid70_d435i.launch rviz:=false use_camera:=true'"

# Pane 1: EGO planner.
PANE_1_COMMAND="docker exec -it daib-algorithm-adapter bash -lc 'source /opt/ros/noetic/setup.bash; source /opt/daib_ws/devel/setup.bash; exec roslaunch --screen ego_planner daib_single_uav.launch'"

# Pane 2: DAIB Explorer.
PANE_2_COMMAND="docker exec -it daib-algorithm-adapter bash -lc 'source /opt/ros/noetic/setup.bash; source /opt/daib_ws/devel/setup.bash; exec roslaunch --screen daib_explorer explorer.launch pvbsm_memory_enabled:=false pvbsm_scoring_enabled:=false'"

# Pane 3: DJI PSDK velocity adapter and UDP output.
PANE_3_COMMAND="docker exec -it daib-algorithm-adapter bash -lc 'source /opt/ros/noetic/setup.bash; source /opt/daib_ws/devel/setup.bash; exec roslaunch --screen psdk_velocity_adapter adapter.launch odom_child_optical:=true dji_y_sign:=-1 horizontal_limit_m_s:=0.1 vertical_limit_m_s:=0.05 yaw_limit_deg_s:=0 udp_enabled:=true udp_host:=192.168.60.210 udp_port:=19090'"

# Set to 0 to create the session without attaching.
ATTACH_AFTER_START=1
